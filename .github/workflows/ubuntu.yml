name: ubuntu
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ubuntu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenGL and X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev
      - name: Configure
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Install
        run: cmake --install build --config Release --prefix out
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ble-motion-demo-ubuntu
          path: out/bin/
          if-no-files-found: error
